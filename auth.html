<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in · MetroMate</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23070b14'/%3E%3Ccircle cx='32' cy='32' r='15' fill='none' stroke='%234cc3ff' stroke-width='5'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%23ff5470'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth.css">
</head>
<body>
<div class="bg-grid" aria-hidden="true"></div>
<div class="bg-glow bg-glow-a" aria-hidden="true"></div>
<div class="bg-glow bg-glow-b" aria-hidden="true"></div>

<main class="auth-wrap">
  <a class="brand auth-brand" href="/">
    <span class="brand-mark"><span class="brand-ring"></span><span class="brand-dot"></span></span>
    <span class="brand-name">Metro<span class="brand-accent">Mate</span></span>
  </a>
  <div class="auth-card glass">
    <div class="tabs" role="tablist">
      <button class="tab active" id="tabLogin" type="button">Sign in</button>
      <button class="tab" id="tabSignup" type="button">Create account</button>
    </div>
    <h1 class="auth-title">Your city, <span class="grad">your commute</span></h1>
    <p class="auth-sub">Sign in to sync saved journeys, personal alerts and ETA preferences across devices.</p>
    <form id="authForm" novalidate>
      <label class="field" id="nameField" hidden>Name
        <input type="text" id="name" autocomplete="name" placeholder="Asha Patel">
      </label>
      <label class="field">Email
        <input type="email" id="email" autocomplete="email" placeholder="you@metro.city">
      </label>
      <label class="field">Password
        <input type="password" id="password" autocomplete="current-password" placeholder="••••••••">
      </label>
      <p class="auth-err" id="authErr" role="alert"></p>
      <button class="btn btn-primary auth-btn" id="authSubmit" type="submit">Sign in</button>
    </form>
    <p class="auth-note mono">Passwords are salted + hashed with scrypt · sessions are bearer tokens stored in SQLite.</p>
  </div>
</main>
<script src="auth.js"></script>
</body>
</html>
